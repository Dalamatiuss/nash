html{background:#0b0c09}body{background:transparent!important}

html{scroll-behavior:smooth;scroll-padding-top:150px}
body{font-family:Barlow,system-ui,sans-serif;color:var(--floodlight);line-height:1.6}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
h1,h2{font-family:var(--display);font-style:italic;font-weight:900;line-height:1;text-transform:uppercase}
.wrap{width:min(1100px,92%);margin-inline:auto}
header{position:sticky;top:0;z-index:10;background:rgba(11,12,9,.92);backdrop-filter:blur(10px);border-bottom:2px solid var(--red)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;gap:1rem}
.brand{font:italic 900 1.5rem var(--display)}
.btn{display:inline-block;padding:.7rem 1.4rem;font:italic 800 1.1rem var(--display);color:#fff;background:var(--red);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:transform .2s,background .2s}
.btn:hover{transform:translateX(4px);background:var(--coral);color:#fff}
.tabs{display:flex;gap:.5rem;overflow-x:auto;padding:0 0 .7rem;scrollbar-width:none}
.tabs a{flex:none;padding:.3rem 1rem;border:2px solid var(--floodlight);font:italic 800 1.05rem var(--display);transition:.2s}
.tabs a:hover{background:var(--coral);border-color:var(--coral)}
.intro{padding:2.5rem 0 0}
.intro h1{font-size:clamp(2.6rem,8vw,5rem)}
.intro p{color:var(--mute);margin-top:.6rem}
section{padding:3rem 0 1rem}
h2{font-size:clamp(2rem,5vw,3rem);border-left:8px solid var(--red);padding-left:.8rem;margin-bottom:1.4rem}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.2rem}
.item{background:var(--turf);display:flex;flex-direction:column;border-bottom:5px solid var(--red);transition:transform .25s}
.item:hover{transform:translateY(-6px)}
.pic{aspect-ratio:1;background:linear-gradient(135deg,#1c1e15,#33362a);display:grid;place-items:center;font-size:3rem;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:1rem;display:grid;gap:.3rem;flex:1}
.info h3{font-size:1.1rem;font-weight:600}
.price{font:italic 900 1.8rem var(--display);color:var(--coral)}
.info .btn{margin-top:.5rem;background:#25a244;text-align:center}
.info .btn:hover{background:#2fc055}
footer{margin-top:4rem;padding:2rem 0;text-align:center;background:#000;border-top:4px solid var(--red);color:var(--mute)}
@media(max-width:480px){.items{grid-template-columns:repeat(2,1fr);gap:.7rem}.info{padding:.7rem}.price{font-size:1.4rem}.btn{padding:.6rem .8rem;font-size:1rem}.brand{font-size:1.2rem}}
</style>
</head>
<body>
<div class="bgfix" aria-hidden="true"></div>
<header><div class="wrap">
  <div class="bar"><a class="brand" href="index.html">&#8592; Nash Sports</a><a class="btn" href="tel:+254704813998">Call now</a></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>

<main class="wrap">
  <div class="intro"><h1>Photos &amp; prices</h1><p>Tap "Ask on WhatsApp" under any item and we will reply with stock and sizes.</p></div>
  <div id="catalog"></div>
</main>

<footer>Nash Sports Apparel &middot; 0704 813 998 &middot; For all your sportswear needs</footer>

<script>
/* ===== EDIT YOUR ITEMS HERE =====
   One line per item. Put the photo in the "images" folder and write its file name.
   The items below are EXAMPLES: replace the names, prices and photos with your real stock. */
const WHATSAPP = "254704813998";
const CATEGORIES = [
  { id: "jerseys",    title: "Jerseys & kits",       items: [
    { name: "Replica jersey (example)",   price: "KSh 1,500", img: "images/jersey.jpeg" },
    { name: "Training kit (example)",     price: "KSh 2,000", img: "images/jersey2.jpg" } ]},
  { id: "boots",      title: "Football boots",       items: [
    { name: "Firm ground boots (example)", price: "KSh 3,500", img: "images/boots1.jpeg" },
    { name: "Turf boots (example)",        price: "KSh 3,000", img: "images/boots2.jpeg" } ]},
  { id: "balls",      title: "Balls",                items: [
    { name: "Match ball size 5 (example)", price: "KSh 2,500", img: "images/ball1.jpeg" },
    { name: "Training ball (example)",     price: "KSh 1,200", img: "images/ball2.jpg" } ]},
  { id: "protection", title: "Protection & gloves",  items: [
    { name: "Shin guards (example)",       price: "KSh 600",   img: "images/shin1.jpg" },
    { name: "Goalkeeper gloves (example)", price: "KSh 1,800", img: "images/gloves1.jpg" } ]},
  { id: "teams",      title: "Team orders",          items: [
    { name: "Custom team kit, per set (example)", price: "Ask for price", img: "images/team1.jpg" } ]}
];
/* ================================= */

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("tabs").innerHTML = CATEGORIES.map(c => `<a href="#${c.id}">${esc(c.title)}</a>`).join("");
document.getElementById("catalog").innerHTML = CATEGORIES.map(c => `
  <section id="${c.id}"><h2>${esc(c.title)}</h2><div class="items">${c.items.map(i => {
    const msg = encodeURIComponent(`Hello Nash Sports, I am interested in: ${i.name} (${i.price}). Is it available?`);
    return `<article class="item"><div class="pic"><img src="${esc(i.img)}" alt="${esc(i.name)}" loading="lazy" onerror="this.parentNode.textContent='\u26BD'"></div>
      <div class="info"><h3>${esc(i.name)}</h3><div class="price">${esc(i.price)}</div>
      <a class="btn" href="https://wa.me/${WHATSAPP}?text=${msg}" target="_blank" rel="noopener">Ask on WhatsApp</a></div></article>`;
  }).join("")}</div></section>`).join("");
</script>
</body>
</html>
